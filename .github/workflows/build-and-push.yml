name: Build and Deploy pdf-edit

# Every push to main builds the image, uploads it to GHCR with a version tag
# and pins that tag in k8s/kustomization.yaml. Argo CD (app "pdf-edit") sees
# the pinned tag and rolls it out to the home lab.

"on":
  push:
    branches: [main]
    # Notes-only changes don't build or roll out a new version.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-push
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run server tests
        run: |
          python -m pip install --quiet -r server/requirements-dev.txt
          cd server && AUTH_DISABLED=1 python -m pytest -q

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version tag
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "TAG=${VERSION}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/daav817/pdf-edit:latest
            ghcr.io/daav817/pdf-edit:${{ steps.version.outputs.TAG }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.TAG }}

      - name: Pin new image tag in k8s manifests
        run: |
          sed -i "s/newTag: .*/newTag: \"${{ steps.version.outputs.TAG }}\"/" k8s/kustomization.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi
          git commit -m "chore: deploy pdf-edit ${{ steps.version.outputs.TAG }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
