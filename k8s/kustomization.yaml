apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Everything lives in its own namespace. It needs two secrets there (copied
# from the default namespace, never stored in git): ghcr-pull-secret and
# pdf-edit-secrets (JWT_SECRET, the same value energia-app signs with).
namespace: pdf-edit
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: ghcr.io/daav817/pdf-edit
    newTag: "0.1.0.8"
